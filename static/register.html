<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione — Genesi</title>
    <link rel="stylesheet" href="/static/auth.css">
    <!-- Iubenda Widget -->
    <script type="text/javascript"
        src="https://embeds.iubenda.com/widgets/c29c96b8-4972-4418-b50c-83741eaa22d4.js"></script>
</head>

<style>
#platform-popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}
#platform-popup.show { display: flex; }
#platform-popup .popup-box {
    background: #1e1e2e;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#platform-popup .popup-box h2 { margin: 0 0 8px; font-size: 1.3rem; color: #fff; }
#platform-popup .popup-box p  { margin: 0 0 24px; color: #aaa; font-size: 0.95rem; }
#platform-popup .popup-btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
}
#platform-popup .popup-btn.whatsapp { background: #25D366; }
#platform-popup .popup-btn.telegram  { background: #2AABEE; }
</style>

<body>
<div id="platform-popup">
    <div class="popup-box">
        <h2>✅ Registrazione completata!</h2>
        <p id="popup-msg">Torna alla chat per iniziare.</p>
        <a id="popup-btn" href="#" class="popup-btn">Torna alla chat</a>
    </div>
</div>
    <div class="auth-card">
        <h1>Crea il tuo account</h1>
        <p class="subtitle">Entra in Genesi. Il tuo spazio personale.</p>

        <form id="register-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="la-tua@email.com" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Minimo 8 caratteri, 1 maiuscola, 1 numero" required
                    autocomplete="new-password">
            </div>
            <div class="field">
                <label for="password2">Conferma password</label>
                <input type="password" id="password2" name="password_confirm" placeholder="Ripeti la password" required
                    autocomplete="new-password">
            </div>
            <button type="submit" class="btn" id="submit-btn">Registrati</button>
        </form>

        <div id="msg" class="msg"></div>

        <div class="links">
            <a href="/login">Hai già un account? Accedi</a>
        </div>
    </div>

    <script src="/static/register.js?v={{ build_version }}"></script>
</body>

</html>
