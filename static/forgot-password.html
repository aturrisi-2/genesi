<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password dimenticata — Genesi</title>
    <link rel="stylesheet" href="/static/auth.css">
    <!-- Iubenda Widget -->
    <script type="text/javascript"
        src="https://embeds.iubenda.com/widgets/c29c96b8-4972-4418-b50c-83741eaa22d4.js"></script>
</head>

<body>
    <div class="auth-card">
        <h1>Recupera password</h1>
        <p class="subtitle">Inserisci la tua email. Se è registrata, riceverai un link per reimpostare la password.</p>

        <form id="forgot-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="la-tua@email.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn" id="submit-btn">Invia link</button>
        </form>

        <div id="msg" class="msg"></div>

        <div class="links">
            <a href="/login">Torna al login</a>
        </div>
    </div>

    <script src="/static/forgot-password.js?v={{ build_version }}"></script>
</body>

</html>
