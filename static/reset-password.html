<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reimposta password — Genesi</title>
    <link rel="stylesheet" href="/static/auth.css">
    <!-- Iubenda Widget -->
    <script type="text/javascript"
        src="https://embeds.iubenda.com/widgets/c29c96b8-4972-4418-b50c-83741eaa22d4.js"></script>
</head>

<body>
    <div class="auth-card">
        <h1>Nuova password</h1>
        <p class="subtitle">Scegli una nuova password per il tuo account.</p>

        <form id="reset-form">
            <div class="field">
                <label for="password">Nuova password</label>
                <input type="password" id="password" name="password" placeholder="Minimo 8 caratteri, 1 maiuscola, 1 numero" required
                    autocomplete="new-password">
            </div>
            <div class="field">
                <label for="password2">Conferma password</label>
                <input type="password" id="password2" name="password_confirm" placeholder="Ripeti la password" required
                    autocomplete="new-password">
            </div>
            <button type="submit" class="btn" id="submit-btn">Reimposta password</button>
        </form>

        <div id="msg" class="msg"></div>

        <div class="links">
            <a href="/login">Torna al login</a>
        </div>
    </div>

    <script src="/static/reset-password.js?v={{ build_version }}"></script>
</body>

</html>
